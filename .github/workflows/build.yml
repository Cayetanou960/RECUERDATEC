name: Compilar RecuerdaTec

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Permiso de ejecucion para gradlew
        run: chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests de la logica compartida (JVM)
        run: ./gradlew :shared:jvmTest

      - name: Compilar escritorio
        run: ./gradlew :desktopApp:compileKotlin

      - name: Compilar Android (APK de depuracion)
        run: ./gradlew :androidApp:assembleDebug

      - name: Compilar web (WebAssembly)
        continue-on-error: true
        run: ./gradlew :webApp:wasmJsBrowserDistribution

      - name: Guardar el APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RecuerdaTec-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Guardar la web compilada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RecuerdaTec-web
          path: webApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: ignore
